@if (feedbackService.currentFeedback(); as feedback) {
  <div
    class="fixed top-8 right-8 z-[9999] min-w-[320px] max-w-md shadow-xl rounded-lg p-4 flex items-start gap-3 alert-enter bg-white border border-gray-100"
    [ngClass]="{
      'alert-success': feedback.type === 'success',
      'alert-error': feedback.type === 'error',
      'alert-warning': feedback.type === 'warning',
    }"
  >
    <div class="flex-1 mt-0.5">
      <p class="font-medium text-sm">{{ feedback.message }}</p>
    </div>
    <button
      (click)="feedbackService.closeFeedback()"
      class="text-gray-400 hover:text-gray-700 transition-colors focus:outline-none"
      aria-label="Fechar alerta"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
}
