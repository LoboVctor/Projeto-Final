<div (click)="abrirPerfil.emit()"
  class="card-aluno group bg-white border border-[#E8E3EF] rounded-2xl cursor-pointer w-full max-w-[180px]">
  <div class="card-aluno__conteudo flex flex-col items-center p-3 w-full h-full">
    <div
      class="w-full aspect-square mb-3 mt-5 rounded-xl overflow-hidden bg-[#F7F5FA] flex items-center justify-center border border-[#E8E3EF]">
      @if (foto()) {
      <img [src]="foto()" [alt]="nome()" class="w-full h-full object-cover" />
      }

      @if (!foto()) {
      <svg class="w-12 h-12 text-[#B79CED]/50" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
      }
    </div>

    <div class="flex flex-col items-center text-center w-full">
      <span class="text-[10px] text-gray-500 font-nunito font-bold mb-1">
        {{ matricula() || 'Sem matrícula' }}
      </span>

      <h3 class="text-sm font-sora font-bold text-[#4A248A] mb-2 truncate w-full px-1" [title]="nome()">
        {{ nome() }}
        @if (idade()) {
        , {{ idade() }} anos
        }
      </h3>

      <span
        class="px-2 py-0.5 bg-[#E8E3EF] text-[#4A248A] rounded text-[10px] font-nunito font-bold border border-[#B79CED]/30">
        {{ diagnostico() }}
      </span>
    </div>
  </div>
</div>
