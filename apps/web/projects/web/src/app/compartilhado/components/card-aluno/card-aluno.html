<div (click)="abrirPerfil.emit()"
  class="card-aluno group relative bg-white hover:bg-[#F7F5FA] border border-[#E8E3EF] rounded-2xl cursor-pointer transition-all duration-300 hover:shadow-md w-full h-64">

  <div class="card-aluno__conteudo flex flex-col items-center p-4 w-full h-full">
    <div
      class="w-20 h-20 sm:w-24 sm:h-24 mb-3 rounded-2xl overflow-hidden bg-[#F7F5FA] flex items-center justify-center border border-[#E8E3EF] shrink-0">
      @if (foto()) {
      <img [src]="foto()" [alt]="nome()" class="w-full h-full object-cover" />
      }

      @if (!foto()) {
      <svg class="w-10 h-10 text-[#B79CED]/50" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
      }
    </div>

    <div class="flex flex-col items-center text-center w-full flex-grow">
      <span class="text-[10px] text-gray-500 font-nunito font-bold mb-1">
        {{ matricula() || 'Sem matrícula' }}
      </span>

      <div class="flex flex-col mb-1 w-full px-1">
        <h3 class="text-sm font-sora font-bold text-[#4A248A] line-clamp-2 m-0 leading-tight" [title]="nome()">
          {{ nome() }}
        </h3>
        @if (idade()) {
        <div class="flex items-center text-[11px] text-[#4A248A]/80 mt-0.5 justify-center font-nunito font-semibold">
          <span>{{ idade() }} anos</span>
        </div>
        }
      </div>

      <span
        [class]="'px-2 py-0.5 mt-auto rounded text-[10px] font-nunito font-bold border ' + classeCorTag()">
        {{ diagnostico() | diagLabel }}
      </span>
    </div>
  </div>
</div>
