@if (confirmacaoService.estado(); as estado) {
<div
  class="fixed inset-0 bg-black/50 z-[200] flex items-center justify-center p-4 backdrop-blur-sm animate-overlay-enter"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirmacao-dialog-titulo"
  (click)="cancelar()">
  <div
    class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-6 relative animate-modal-enter"
    (click)="$event.stopPropagation()">
    <button
      type="button"
      (click)="cancelar()"
      class="absolute top-4 right-4 text-elo-texto-secundario hover:text-elo-texto-principal transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-elo-roxo-principal rounded-full"
      aria-label="Fechar">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="flex flex-col items-center text-center">
      <div
        class="w-14 h-14 rounded-full flex items-center justify-center mb-4"
        [ngClass]="{
          'bg-elo-vermelho-alerta/10 text-elo-vermelho-alerta': estado.variante === 'danger',
          'bg-elo-girassol/20 text-elo-roxo-principal': estado.variante === 'warning',
          'bg-elo-lavanda/20 text-elo-roxo-principal': estado.variante === 'default'
        }">
        @switch (estado.variante) {
          @case ('danger') {
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          }
          @case ('warning') {
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          }
          @default {
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
        }
      </div>

      <h2 id="confirmacao-dialog-titulo" class="text-lg font-bold text-elo-texto-principal font-sora mb-2">
        {{ estado.titulo }}
      </h2>
      <p class="text-sm text-elo-texto-secundario leading-relaxed mb-6">
        {{ estado.mensagem }}
      </p>
    </div>

    <div class="flex gap-3">
      <button
        type="button"
        (click)="cancelar()"
        class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-elo-texto-secundario bg-elo-fundo hover:bg-elo-borda border border-elo-borda transition-all cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-elo-roxo-principal">
        {{ estado.textoCancelar }}
      </button>
      <button
        type="button"
        (click)="confirmar()"
        class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-white transition-all cursor-pointer focus:outline-none focus-visible:ring-2"
        [ngClass]="{
          'bg-elo-vermelho-alerta hover:bg-red-600 focus-visible:ring-elo-vermelho-alerta': estado.variante === 'danger',
          'bg-elo-roxo-principal hover:bg-elo-roxo-profundo focus-visible:ring-elo-roxo-principal': estado.variante !== 'danger'
        }">
        {{ estado.textoConfirmar }}
      </button>
    </div>
  </div>
</div>
}
