<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs animate-fade-in">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden border border-gray-100">
    
    <div class="flex items-center justify-between p-5 border-b border-gray-100 bg-slate-50">
      <div>
        <h3 class="text-lg font-bold font-['Sora'] text-slate-700 m-0">Novo Laudo / Diagnóstico</h3>
        <p class="text-xs text-slate-500 m-0 mt-0.5">Anexe os documentos médicos oficiais do estudante.</p>
      </div>
      <button (click)="emitirFechar()" class="text-gray-400 hover:text-gray-600 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="laudoForm" (ngSubmit)="salvar()" class="p-6 space-y-5 m-0">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-600 font-['Sora']">Diagnóstico / CID *</label>
          <input 
            type="text" 
            formControlName="diagnostico"
            placeholder="Ex: TDAH, Autismo (TEA)"
            class="w-full p-2.5 rounded-lg border border-gray-200 bg-slate-50 focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 outline-none transition-all text-sm" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-slate-600 font-['Sora']">Data de Emissão *</label>
          <input 
            type="date" 
            formControlName="dataEmissao"
            class="w-full p-2.5 rounded-lg border border-gray-200 bg-slate-50 focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 outline-none transition-all text-sm" />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-600 font-['Sora']">Documento (PDF, JPG, PNG) *</label>
        <input 
          type="file" 
          (change)="onFileChange($event)"
          accept=".pdf,.jpg,.jpeg,.png"
          class="w-full p-2.5 rounded-lg border border-dashed border-gray-300 bg-slate-50 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 transition-all cursor-pointer" />
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100">
        <button type="button" (click)="emitirFechar()" class="px-5 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100 rounded-lg transition-colors">
          Cancelar
        </button>
        <button 
          type="submit" 
          [disabled]="laudoForm.invalid || !arquivoSelecionado || enviando" 
          class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold rounded-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-xs flex items-center gap-2">
          
          @if (enviando) {
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Enviando...
          } @else {
            Fazer Upload e Salvar
          }
        </button>
      </div>
    </form>

    @if (laudos && laudos.length > 0) {
      <div class="p-6 bg-slate-50 border-t border-gray-100 flex-1 overflow-y-auto max-h-[220px]">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 font-['Sora']">
          Laudos Anexados
        </h4>
        <div class="space-y-2">
          @for (laudo of laudos; track laudo.id) {
            <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg shadow-2xs">
              
              <div class="min-w-0 flex-1 pr-3">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-sm mr-2 inline-block uppercase bg-blue-100 text-blue-800">
                  {{ laudo.tipo }}
                </span>
                <span class="text-sm font-semibold text-slate-700 truncate mr-2">{{ laudo.diagnostico }}</span>
                <span class="text-xs text-slate-400 font-medium whitespace-nowrap">Emissão: {{ laudo.dataEmissao | date:'dd/MM/yyyy' }}</span>
              </div>
              
              <div class="flex items-center shrink-0">
                <a [href]="laudo.urlArquivo" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-md transition-colors border border-gray-200">
                  <svg class="w-4 h-4 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                  Abrir Laudo
                </a>
              </div>

            </div>
          }
        </div>
      </div>
    }

  </div>
</div>
