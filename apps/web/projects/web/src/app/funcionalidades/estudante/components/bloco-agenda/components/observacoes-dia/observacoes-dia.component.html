<div class="flex flex-col">


  @if (!modoEdicao) {
    @if (observacoes) {
      <div class="flex-1 text-gray-800 text-sm leading-8 agenda-font whitespace-pre-wrap break-words w-full max-w-full box-border py-2 cursor-pointer group" style="overflow-wrap: anywhere; word-break: break-word;" (click)="ativarEdicao()">
        {{ observacoes }}
        <div class="mt-4 flex items-center space-x-2 text-amber-600 opacity-0 group-hover:opacity-100 transition-opacity">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span class="text-xs font-semibold">Editar</span>
        </div>
      </div>
    } @else {
   
      <div
        class="flex-1 flex flex-col items-center justify-center text-center cursor-pointer group rounded-xl border-2 border-dashed border-amber-200 hover:border-amber-400 hover:bg-amber-50/50 transition-all duration-200 p-8 m-2"
        (click)="ativarEdicao()"
        role="button"
        tabindex="0"
        (keydown.enter)="ativarEdicao()"
        aria-label="Adicionar"
      >
        <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mb-3 group-hover:bg-amber-200 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="text-amber-600">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
        <p class="text-sm font-semibold text-amber-800">Nenhuma observação registrada para este dia.</p>
        <p class="text-xs text-amber-600 mt-1">Clique para adicionar uma anotação escolar.</p>
      </div>
    }
  }

  @else {
    <div class="flex-1 flex flex-col min-w-0 max-w-full">
      <textarea
        #textareaEl
        class="agenda-font w-full max-w-full box-border bg-transparent border-none resize-none focus:outline-none focus:ring-0 text-gray-800 text-sm leading-7 placeholder-amber-300/80 py-1"
        style="height: 130px; overflow-wrap: anywhere; word-break: break-word;"
        placeholder="Escreva aqui as observações do dia sobre o aluno"
        [(ngModel)]="textoEditado"
        [spellcheck]="false"
      ></textarea>

      <div class="mt-2 flex items-center justify-between border-t border-amber-200 pt-2">
        <span class="text-xs text-amber-600/70 font-sans">{{ textoEditado.length }} car.</span>
        <div class="flex space-x-1.5">
          <button
            (click)="cancelarEdicao()"
            class="px-2 py-1 rounded text-xs font-semibold text-gray-600 hover:bg-gray-200 transition-colors cursor-pointer font-sans"
          >
            Cancelar
          </button>
          <button
            (click)="salvar()"
            class="px-2 py-1 rounded text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 transition-colors cursor-pointer font-sans"
          >
            Salvar
          </button>
        </div>
      </div>
    </div>
  }

</div>
