<div class="fixed inset-0 z-[1000] flex items-center justify-center p-4">
  <!-- Overlay Backdrop -->
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" (click)="fechar.emit()"></div>

  <!-- Modal Panel -->
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col transform transition-all">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-gray-900 font-sora m-0">Avaliação da Meta</h2>
          <p class="text-xs text-gray-500 m-0 mt-0.5">Defina o resultado final para o semestre</p>
        </div>
      </div>
      <button type="button" (click)="fechar.emit()"
              class="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Meta Info -->
    <div class="px-6 py-4 bg-gray-50 border-b border-gray-100">
      <p class="text-sm text-gray-700 font-medium">Meta atual</p>
      <p class="text-sm text-gray-500 italic mt-1">{{ meta().descricao }}</p>
    </div>

    <!-- Body / Formulário -->
    <div class="p-6 overflow-y-auto max-h-[60vh]">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Avaliação Final (Slider) -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label class="block text-sm font-bold text-gray-700">Avaliação Final</label>
            <span [class]="'text-xs font-bold px-2 py-1 rounded-full border ' + scoreFinalBadgeClass(scoreFinalValue)">
              {{ scoreFinalLabel(scoreFinalValue) }}
            </span>
          </div>
          
          <div class="px-2">
            <input type="range" min="0" max="5" step="1" formControlName="scoreFinal"
                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
            <div class="flex justify-between text-xs text-gray-400 font-medium mt-2">
              <span>0</span>
              <span>1</span>
              <span>2</span>
              <span>3</span>
              <span>4</span>
              <span>5</span>
            </div>
          </div>
        </div>

        <!-- Parecer -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-700">
            Parecer do Professor
          </label>
          <textarea formControlName="parecer" rows="4"
                    class="w-full rounded-xl border border-gray-200 p-3 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all placeholder:text-gray-300 resize-none"
                    placeholder="Escreva a avaliação final detalhada sobre o atingimento desta meta">
          </textarea>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-end gap-3 bg-gray-50">
      <button type="button" (click)="fechar.emit()"
              class="px-4 py-2 text-sm font-semibold text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 hover:text-gray-800 transition-colors">
        Cancelar
      </button>
      <button type="button" (click)="onSubmit()" [disabled]="form.invalid || isLoading"
              class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Salvar Avaliação
      </button>
    </div>
  </div>
</div>
