<nav
  class="flex flex-col h-full bg-elo-roxo-profundo text-white shadow-xl border-r border-elo-roxo-profundo overflow-y-auto"
>
  <div class="px-6 py-6">
    <h2
      class="text-2xl font-bold text-elo-girassol tracking-tight"
      style="font-family: 'Sora', sans-serif"
    >
      Olá, {{ userName() }}
    </h2>
    <p class="text-white mt-1 text-sm font-medium opacity-80 capitalize">{{ currentDate() }}</p>
  </div>

  <ul class="flex-1 space-y-1 px-3">
    @for (item of menu(); track item) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-elo-girassol/20"
          #rla="routerLinkActive"
          class="flex items-center px-4 py-3 rounded-xl transition-all duration-200 group"
          [ngClass]="rla.isActive ? '' : 'hover:bg-white/5'"
        >
          @switch (item.icon) {
            <!-- Home SVG -->
            @case ('home') {
              <svg
                class="w-6 h-6 shrink-0 transition-colors duration-200"
                [ngClass]="
                  rla.isActive ? 'text-elo-girassol' : 'text-white group-hover:text-elo-lavanda'
                "
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                />
              </svg>
            }
            <!-- Users SVG -->
            @case ('users') {
              <svg
                class="w-6 h-6 shrink-0 transition-colors duration-200"
                [ngClass]="
                  rla.isActive ? 'text-elo-girassol' : 'text-white group-hover:text-elo-lavanda'
                "
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                />
              </svg>
            }
            <!-- Graduation Cap SVG -->
            @case ('graduation-cap') {
              <svg
                class="w-6 h-6 shrink-0 transition-colors duration-200"
                [ngClass]="
                  rla.isActive ? 'text-elo-girassol' : 'text-white group-hover:text-elo-lavanda'
                "
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path d="M12 14l9-5-9-5-9 5 9 5z" />
                <path
                  d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"
                />
              </svg>
            }
            <!-- Calendar SVG -->
            @case ('calendar') {
              <svg
                class="w-6 h-6 shrink-0 transition-colors duration-200"
                [ngClass]="
                  rla.isActive ? 'text-elo-girassol' : 'text-white group-hover:text-elo-lavanda'
                "
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                />
              </svg>
            }
          }
          <span
            class="ml-4 font-medium transition-colors duration-200"
            [ngClass]="
              rla.isActive ? 'text-elo-girassol' : 'text-white group-hover:text-elo-lavanda'
            "
          >
            {{ item.label }}
          </span>
        </a>
      </li>
    }
  </ul>

  <div class="px-3 pb-6">
    <div class="h-px w-full bg-white/20 mb-4"></div>
    <button
      (click)="fazerLogout()"
      type="button"
      class="flex items-center w-full px-4 py-3 rounded-xl hover:bg-white/5 transition-all duration-200 group cursor-pointer"
    >
      <svg
        class="w-6 h-6 shrink-0 text-white group-hover:text-elo-lavanda transition-colors duration-200"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>
      <span
        class="ml-4 font-medium text-white group-hover:text-elo-lavanda transition-colors duration-200"
        >{{ logout.label }}</span
      >
    </button>
  </div>
</nav>
