<nav class="relative flex flex-col h-full bg-[#4A248A] shadow-2xl overflow-hidden font-sans border-r border-[#4A248A]">

  <!-- Fundo da Sidebar (Imagem + Gradiente + Overlays) -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <!-- Camada 1: Roxo base da sidebar -->
    <div class="absolute inset-0 bg-elo-roxo-profundo"></div>

    <!-- Camada 2: QUEBRA CABEÇA 2 (quebra-cabeca-sidebar.png) -->
    <div class="absolute inset-0 bg-cover bg-top bg-no-repeat opacity-10 mix-blend-screen"
      style="background-image: url('/imagens/quebra-cabeca-sidebar.png');"></div>

    <!-- Camada 3: Overlay gradiente leve apenas para legibilidade no topo -->
    <div class="absolute inset-0 bg-gradient-to-b from-elo-roxo-profundo/70 via-transparent to-elo-roxo-profundo/60">
    </div>

    <!-- Brilho vertical lateral -->
    <div class="absolute top-0 right-0 w-[1px] h-full bg-gradient-to-b from-white/0 via-white/10 to-white/0"></div>
  </div>

  <!-- Conteúdo em z-10 para ficar acima do fundo -->
  <div class="relative z-10 flex flex-col h-full overflow-y-auto custom-scrollbar">

    <!-- Topo: Logo Projeto ELO -->
    <div class="px-6 pt-10 pb-6 flex items-center gap-3">
      <!-- Ícone Flor/Sol — laranja vibrante recuperando identidade anterior -->
      <div class="flex shrink-0 items-center justify-center" style="color: #F97316;">
        <svg class="w-10 h-10 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
          <!-- Pétalas e centro simulando a logo -->
          <circle cx="12" cy="12" r="3.5" fill="#2D1E40" stroke="currentColor" stroke-width="2.5"></circle>
          <path
            d="M12 2a2.5 2.5 0 012.5 2.5v1.23a6.992 6.992 0 00-5 0V4.5A2.5 2.5 0 0112 2zm7.07 2.93a2.5 2.5 0 01.36 3.49l-1.02 1.35a6.99 6.99 0 00-4-3l1.35-1.02a2.5 2.5 0 013.31-.82zM22 12a2.5 2.5 0 01-2.5 2.5h-1.23a6.992 6.992 0 000-5h1.23A2.5 2.5 0 0122 12zm-2.93 7.07a2.5 2.5 0 01-3.49.36l-1.35-1.02a6.99 6.99 0 003-4l1.02 1.35a2.5 2.5 0 01.82 3.31zM12 22a2.5 2.5 0 01-2.5-2.5v-1.23a6.992 6.992 0 005 0V19.5A2.5 2.5 0 0112 22zm-7.07-2.93a2.5 2.5 0 01-.36-3.49l1.02-1.35a6.99 6.99 0 004 3l-1.35 1.02a2.5 2.5 0 01-3.31.82zM2 12a2.5 2.5 0 012.5-2.5h1.23a6.992 6.992 0 000 5H4.5A2.5 2.5 0 012 12zm2.93-7.07a2.5 2.5 0 013.49-.36l1.35 1.02a6.99 6.99 0 00-3 4l-1.02-1.35a2.5 2.5 0 01-.82-3.31z" />
        </svg>
      </div>
      <h1 class="text-[26px] font-bold text-white tracking-tight font-['Sora'] m-0 leading-none mt-1">Projeto ELO</h1>
    </div>

    <!-- Saudação e Data -->
    <div class="px-6 pb-7 mt-2">
      <p class="text-white/90 text-base font-semibold mb-1">Olá,</p>
      <h2 class="text-[22px] font-extrabold tracking-tight leading-snug"
        style="font-family: 'Sora', sans-serif; color: #F4C542;">
        {{ userName() }}
      </h2>
      <p class="text-white/60 mt-3 text-xs font-medium capitalize tracking-wide">{{ currentDate() }}</p>
    </div>

    <!-- Navegação -->
    <ul class="flex-1 space-y-2 px-5 mt-4">
      @for (item of menu(); track item) {
      <li>
        <a [routerLink]="item.route" routerLinkActive="active-menu-item" #rla="routerLinkActive"
          class="flex items-center px-4 py-3.5 rounded-2xl transition-all duration-300 group font-['Sora'] relative overflow-hidden"
          [ngClass]="rla.isActive ? 'bg-elo-roxo-principal/40 text-elo-girassol shadow-sm ring-1 ring-elo-roxo-principal/60' : 'text-white/80 hover:bg-white/10 hover:text-white'">
          <!-- Highlight bar on active -->
          @if (rla.isActive) {
          <div
            class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-1/2 bg-elo-girassol rounded-r-full shadow-[0_0_8px_rgba(251,191,36,0.6)]">
          </div>
          }

          @switch (item.icon) {
          <!-- Home SVG -->
          @case ('home') {
          <svg class="w-[22px] h-[22px] shrink-0 transition-all duration-300"
            [ngClass]="rla.isActive ? 'text-elo-girassol' : 'text-white/60 group-hover:text-white/90'" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          }
          <!-- Users SVG -->
          @case ('users') {
          <svg class="w-[22px] h-[22px] shrink-0 transition-all duration-300"
            [ngClass]="rla.isActive ? 'text-elo-girassol' : 'text-white/60 group-hover:text-white/90'" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          }
          <!-- Graduation Cap SVG -->
          @case ('graduation-cap') {
          <svg class="w-[22px] h-[22px] shrink-0 transition-all duration-300"
            [ngClass]="rla.isActive ? 'text-elo-girassol' : 'text-white/60 group-hover:text-white/90'" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path d="M12 14l9-5-9-5-9 5 9 5z" />
            <path
              d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
          </svg>
          }
          <!-- Calendar SVG -->
          @case ('calendar') {
          <svg class="w-[22px] h-[22px] shrink-0 transition-all duration-300"
            [ngClass]="rla.isActive ? 'text-elo-girassol' : 'text-white/60 group-hover:text-white/90'" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          }
          }
          <span class="ml-4 text-[13px] font-semibold transition-all duration-300 tracking-wide">
            {{ item.label }}
          </span>
        </a>
      </li>
      }
    </ul>

    <!-- Rodapé: Botão Sair -->
    <div class="px-5 pb-8 pt-6 mt-auto">
      <button (click)="fazerLogout()" type="button"
        class="flex items-center justify-start px-5 py-3.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/5 hover:border-white/20 transition-all duration-300 group cursor-pointer shadow-lg backdrop-blur-sm w-[90%] mx-auto">
        <svg class="w-5 h-5 shrink-0 text-white/80 group-hover:text-white transition-colors duration-300" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span
          class="ml-4 text-sm font-semibold text-white/90 group-hover:text-white transition-colors duration-300 tracking-wide">
          {{ logout.label }}
        </span>
      </button>
    </div>

  </div>
</nav>
